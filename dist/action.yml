name: Build and comment Allure report
description: >
  Generates an Allure HTML report, badges, optional test-pyramid artifacts,
  optional GitHub Pages preview, and an upserted PR summary comment.
author: quokkify

branding:
  icon: check-circle
  color: purple

inputs:
  github-token:
    description: GitHub token with pull-requests:write; contents:write is also required when publish-pages is true
    required: true
  results-directory:
    description: Merged Allure results directory, relative to the workspace
    required: false
    default: artifacts/allure-results
  report-directory:
    description: Generated Allure HTML directory, relative to the workspace
    required: false
    default: allure-report
  config-file:
    description: Allure 3 configuration file, relative to the workspace
    required: true
  module-environment-label:
    description: Allure result label whose distinct values become module-scoped environments; empty preserves caller environments
    required: false
    default: "module"
  source-artifacts-directory:
    description: Source root, auto for parent-directory detection, or empty for legacy pre-merged results
    required: false
    default: "auto"
  categories-file:
    description: Optional Allure categories JSON file, relative to the workspace
    required: false
    default: ""
  allure-version:
    description: Exact Allure CLI version
    required: false
    default: "3.15.0"
  pr-number:
    description: Pull request number to comment on; an empty value skips the comment
    required: false
    default: ""
  pages-url:
    description: Optional full report URL included in the PR comment
    required: false
    default: ""
  fork-pr:
    description: Whether the source pull request comes from a fork
    required: false
    default: "false"
  source-run-id:
    description: Source workflow run id used in the report link note
    required: false
    default: ""
  comment-file:
    description: Generated PR comment Markdown path, relative to the workspace
    required: false
    default: allure-pr-comment.md
  comment-marker:
    description: Hidden marker used to find and update this action's existing PR comment
    required: false
    default: "<!-- project-toolkit-allure-ci -->"
  comment-author-login:
    description: Expected author login for installation-token comments; user tokens are resolved automatically
    required: false
    default: "github-actions[bot]"
  pyramid-enabled:
    description: Generate the existing Allure epic test-pyramid snapshot and advisory gate files
    required: false
    default: "false"
  pyramid-markdown-file:
    description: Test-pyramid Markdown output path
    required: false
    default: docs/testing/pyramid-snapshot.md
  pyramid-json-file:
    description: Test-pyramid JSON output path
    required: false
    default: docs/testing/pyramid-snapshot.json
  pyramid-gates-json-file:
    description: Test-pyramid advisory gate JSON output path
    required: false
    default: docs/testing/pyramid-quality-gates.json
  pyramid-source-run-id:
    description: Source workflow run id embedded into the test-pyramid snapshot
    required: false
    default: ""
  pyramid-head-sha:
    description: Source head SHA embedded into the test-pyramid snapshot
    required: false
    default: ""
  pyramid-policy-path:
    description: Optional caller-repository policy path linked from the test-pyramid snapshot
    required: false
    default: ""
  pyramid-artifact-name:
    description: Uploaded test-pyramid artifact name
    required: false
    default: pyramid-snapshot
  pyramid-retention-days:
    description: Test-pyramid artifact retention in days
    required: false
    default: "30"
  publish-pages:
    description: Publish the generated report to a GitHub Pages subdirectory
    required: false
    default: "false"
  pages-destination-directory:
    description: GitHub Pages destination directory, required when publish-pages is true
    required: false
    default: ""
  pages-branch:
    description: Branch that hosts GitHub Pages
    required: false
    default: gh-pages
  pages-retention-count:
    description: Number of newest pr-N report directories to retain; 0 disables pruning
    required: false
    default: "0"

outputs:
  report-directory:
    description: Generated Allure report directory
    value: ${{ inputs.report-directory }}
  comment-file:
    description: Generated PR comment Markdown file
    value: ${{ inputs.comment-file }}
runs:
  using: composite
  steps:
    - name: Generate report and PR comment
      shell: bash
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_RESULTS-DIRECTORY: ${{ inputs.results-directory }}
        INPUT_REPORT-DIRECTORY: ${{ inputs.report-directory }}
        INPUT_CONFIG-FILE: ${{ inputs.config-file }}
        INPUT_MODULE-ENVIRONMENT-LABEL: ${{ inputs.module-environment-label }}
        INPUT_SOURCE-ARTIFACTS-DIRECTORY: ${{ inputs.source-artifacts-directory }}
        INPUT_CATEGORIES-FILE: ${{ inputs.categories-file }}
        INPUT_ALLURE-VERSION: ${{ inputs.allure-version }}
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_PAGES-URL: ${{ inputs.pages-url }}
        INPUT_FORK-PR: ${{ inputs.fork-pr }}
        INPUT_SOURCE-RUN-ID: ${{ inputs.source-run-id }}
        INPUT_COMMENT-FILE: ${{ inputs.comment-file }}
        INPUT_COMMENT-MARKER: ${{ inputs.comment-marker }}
        INPUT_COMMENT-AUTHOR-LOGIN: ${{ inputs.comment-author-login }}
        INPUT_PYRAMID-ENABLED: ${{ inputs.pyramid-enabled }}
        INPUT_PYRAMID-MARKDOWN-FILE: ${{ inputs.pyramid-markdown-file }}
        INPUT_PYRAMID-JSON-FILE: ${{ inputs.pyramid-json-file }}
        INPUT_PYRAMID-GATES-JSON-FILE: ${{ inputs.pyramid-gates-json-file }}
        INPUT_PYRAMID-SOURCE-RUN-ID: ${{ inputs.pyramid-source-run-id }}
        INPUT_PYRAMID-HEAD-SHA: ${{ inputs.pyramid-head-sha }}
        INPUT_PYRAMID-POLICY-PATH: ${{ inputs.pyramid-policy-path }}
        INPUT_PYRAMID-ARTIFACT-NAME: ${{ inputs.pyramid-artifact-name }}
        INPUT_PYRAMID-RETENTION-DAYS: ${{ inputs.pyramid-retention-days }}
        INPUT_PUBLISH-PAGES: ${{ inputs.publish-pages }}
        INPUT_PAGES-DESTINATION-DIRECTORY: ${{ inputs.pages-destination-directory }}
        INPUT_PAGES-BRANCH: ${{ inputs.pages-branch }}
        INPUT_PAGES-RETENTION-COUNT: ${{ inputs.pages-retention-count }}
      run: node "${GITHUB_ACTION_PATH}/dist/index.cjs"
    - name: Upload test-pyramid snapshot
      if: ${{ inputs.pyramid-enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.pyramid-artifact-name }}
        path: |
          ${{ inputs.pyramid-markdown-file }}
          ${{ inputs.pyramid-json-file }}
          ${{ inputs.pyramid-gates-json-file }}
        retention-days: ${{ inputs.pyramid-retention-days }}
    - name: Publish report to GitHub Pages
      if: ${{ inputs.publish-pages == 'true' && inputs.fork-pr != 'true' }}
      uses: quokkify/gh-pages-subdir-action@e936122cbdf5a9676b5587d5a812fadf7ddfde6b # v0.1.1
      with:
        token: ${{ inputs.github-token }}
        publish-dir: ${{ inputs.report-directory }}
        destination-dir: ${{ inputs.pages-destination-directory }}
        branch: ${{ inputs.pages-branch }}
        retention-count: ${{ inputs.pages-retention-count }}
