name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: quokkify/project-toolkit/.github/workflows/release-please.yml@cf38aa9bc134fbfebcd497edc938195cbd6069f1 # v2.12.3
    with:
      mode: manifest
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json
