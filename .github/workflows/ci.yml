name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate action and report behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate metadata and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("action.yml").read_text()
          assert "runs:\n  using: composite" in text
          assert text.index("name: Deploy Allure HTML to GitHub Pages") < text.index("name: Post or update Allure comment on PR")
          assert 'default: "<!-- project-toolkit-allure-ci -->"' in text
          PY
          node --check allure-ci.mjs
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run synthetic Allure 3 smoke test
        run: bash tests/smoke.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and current tree
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .

  required:
    name: Validation pipeline complete
    if: ${{ always() }}
    needs: [validate, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation stage
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [[ "$VALIDATE_RESULT" == success && "$GITLEAKS_RESULT" == success ]] || {
            echo "One or more required validation stages did not succeed." >&2
            exit 1
          }
