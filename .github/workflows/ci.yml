name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ts:
    name: Validate TypeScript implementation
    uses: quokkify/project-toolkit/.github/workflows/node-ci.yml@v2.20.1
    with:
      node-version: "24"
      package-manager: npm
      lint-command: npm run lint
      test-command: npm test && npm run build && bash tests/smoke.sh
      run-build: false
      upload-test-artifacts: true
      test-artifact-path: allure-results
      test-artifact-name: allure-results

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and current tree
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .

  required:
    name: Validation pipeline complete
    if: ${{ always() }}
    needs: [validate-ts, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation stage
        env:
          VALIDATE_TS_RESULT: ${{ needs.validate-ts.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [[ "$VALIDATE_TS_RESULT" == success && "$GITLEAKS_RESULT" == success ]] || {
            echo "One or more required validation stages did not succeed." >&2
            exit 1
          }
